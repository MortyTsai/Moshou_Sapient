# ===================================================================
# MoshouSapient - 行為分析設定檔 (v1.1)
# ===================================================================
# 說明:
# 1. 本檔案定義所有高階 AI 行為分析規則。
# 2. 所有座標點 (x, y) 均基於 AI 的分析解析度 (預設為 1280x736)。
# 3. 座標原點 (0, 0) 位於畫面左上角。
# 4. 您可以使用任何支援 YAML 格式的文字編輯器修改此檔案。
# 5. 修改儲存後，需要重新啟動 MoshouSapient 程式才能生效。
# ===================================================================


# -------------------------------------------------------------------
# 全域錨點設定 (Global Anchor Point Configuration)
# -------------------------------------------------------------------
# "錨點"是系統用來判斷物體位置的基準點，它決定了系統如何「看待」一個被偵測到的物體。
# 此處設定的錨點將作為所有規則的預設值，除非被規則自身的設定所覆寫。
#
# [!!] 這是影響所有偵測準確性的核心參數，請根據您的攝影機角度仔細選擇。
#
# 可選錨點策略:
#   - 'bottom_center': (預設值) 辨識框底邊的中心點。
#                      【最推薦】適用於大多數高角度、地面可見的場景，能準確表示人物腳下的位置。
#   - 'centroid':      辨識框的幾何中心點。
#                      【適用場景】適用於半身人像、無法看到地面的場景，或需要判斷物體中心位置的場合。
#   - 'full_bbox':     整個辨識框區域。
#                      【僅用於 ROI】此策略僅對 ROI 規則有效，用於判斷整個辨識框是否與 ROI 區域相交。
#   - 其他錨點: 'bottom_left', 'bottom_right', 'top_left', 'top_right', 'top_center', 'left_center', 'right_center'
#
# 多錨點模式 (進階):
#   您可以提供一個列表，例如 ['bottom_left', 'bottom_right']。
#   在這種模式下，只要列表中的任何一個錨點滿足觸發條件，規則就會被觸發。
#
anchor_points: 'bottom_center'


# ===================================================================
# 規則 1: 感興趣區域 (Region of Interest, ROI) - 停留偵測
# ===================================================================
# 用途: 偵測是否有人在您劃定的特定多邊形區域內，停留時間超過預設的閾值。
# 範例: 偵測是否有人在門口、窗邊或禁止停留的區域逗留過久。
# -------------------------------------------------------------------
roi:
  # 是否啟用此功能。true: 啟用, false: 禁用
  enabled: true

  # [可選] 覆寫全域錨點設定。
  # 如果此 ROI 區域的偵測目標與全域場景不同（例如，一個用於偵測半身人像的 ROI），
  # 您可以在此處為其指定一個獨立的錨點策略。
  # anchor_points: 'centroid'

  # ROI 區域的頂點座標列表。
  # - 至少需要 3 個點才能構成一個有效的多邊形。
  # - 點的順序可以是順時針或逆時針。
  # - 建議使用線上工具或 MoshouSapient 未來可能提供的 UI 工具來獲取座標。
  # 範例：一個位於畫面右下方的矩形區域。
  polygon_points:
    - [640, 0]
    - [640, 736]
    - [960, 736]
    - [960, 0]

  # 觸發「停留警報」所需的時間閾值 (單位: 秒)。
  # 當一個物體的錨點在此區域內的持續時間超過此值時，將觸發警報。
  dwell_time_threshold: 1.0


# ===================================================================
# 規則 2: 虛擬警戒線 (Tripwire) - 方向性穿越偵測
# ===================================================================
# 用途: 偵測是否有人跨越了您劃定的一條或多條虛擬線段，並可選定特定的觸發方向。
# 範例: 偵測是否有人從門外進入（而非從門內走出）、是否有人翻越圍牆。
# -------------------------------------------------------------------
tripwires:
  # 是否啟用此功能。true: 啟用, false: 禁用
  enabled: true

  # 警戒線列表。您可以定義多條獨立的警戒線。
  lines:
    # 給規則一個名字，方便在日誌中識別
    - name: "Main"

      # 線段的起點 [x1, y1] 和終點 [x2, y2]。
      points: [[640, 736], [640, 0]]

      # [可選] 為這條特定的警戒線覆寫錨點。
      anchor_points: 'right_center'

      # 觸發警報的方向。
      # 'cross_to_right': 表示從線的「左側」穿越到「右側」時觸發。
      # 'cross_to_left':  表示從線的「右側」穿越到「左側」時觸發。
      # 'both':           任何方向的穿越都會觸發。
      # [重要] "左側"和"右側"是相對於線段從起點指向終點的向量而言的。
      alert_direction: "cross_to_left"


# ===================================================================
# 規則 3: 畫面異常警報 (Scene Anomaly Alert) - (v1.2)
# ===================================================================
# 用途: 偵測視訊串流本身的底層異常，不依賴任何 AI 物件偵測。
#       適用於偵測鏡頭被移動、畫面凍結、亮度劇變、鏡頭被遮擋或失焦等情況。
# -------------------------------------------------------------------
scene_anomaly_alerts:
  # --- 總開關與核心參數 ---
  enabled: true

  # 初始校準時長 (秒)。
  # 系統啟動後，會用這段時間學習場景的正常「基線」(平均亮度與清晰度)。
  # 在此期間不會觸發任何警報。
  calibration_duration_seconds: 10

  # 異常狀態持續時長 (秒)。
  # 偵測到的異常狀態必須持續超過此時間，才會觸發警報，以避免短暫波動造成誤報。
  trigger_delay_seconds: 3

  # --- 亮度異常檢查 (Luminance Check) ---
  # 用於偵測畫面是否突然過暗 (如斷電、鏡頭被完全覆蓋) 或過亮 (如燈光直射)。
  luminance_check:
    enabled: true
    # 靈敏度閾值 (百分比)。
    # 當畫面的即時亮度偏離「正常基線」超過此百分比時，視為異常。
    deviation_threshold_percent: 80

  # --- 清晰度異常檢查 (Clarity Check) ---
  # 使用拉普拉斯方差 (Variance of Laplacian) 來量化畫面清晰度。
  # 用於偵測畫面是否模糊 (如鏡頭被遮擋、失焦) 或內容單一。
  clarity_check:
    enabled: true
    # 相對靈敏度閾值 (百分比)。
    deviation_threshold_percent: 70
    # 絕對清晰度閾值。
    # 推薦值: 10.0
    absolute_threshold: 10.0

  # --- 畫面凍結檢查 (Freeze Check) ---
  # 透過計算連續幀之間的差異來偵測畫面是否完全靜止。
  freeze_check:
    enabled: true
    # 靈敏度閾值。
    # 推薦值: 0.01
    difference_threshold: 0.01

  # --- [新功能] 攝影機篡改檢查 (Tamper Check) ---
  # 透過比對場景的結構特徵點，偵測攝影機是否被移動或轉向。
  tamper_check:
    enabled: true
    # 匹配度閾值 (百分比)。
    # 當前畫面對比初始參考畫面的特徵點匹配度持續低於此值時，視為異常。
    # 數值越高，對場景變化的容忍度越低 (即越靈敏)。
    # 推薦值: 40
    match_threshold_percent: 40