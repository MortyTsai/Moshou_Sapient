# ===================================================================
# MoshouSapient 行為分析設定檔
# -------------------------------------------------------------------
# 本檔案定義所有高階 AI 行為分析規則。
# 所有的座標點 (x, y) 均基於 AI 的分析解析度 (預設為 1280x736)。
# 座標原點 (0, 0) 位於畫面左上角。
# ===================================================================

# -------------------------------------------------------------------
# 全域錨點設定 (Global Anchor Point Configuration)
# -------------------------------------------------------------------
# "錨點" 是系統用來判斷物體位置的基準點。不同的場景適用不同的錨點。
# 此處設定的錨點將作為所有規則的預設值，除非被規則自身覆寫。
#
# [!!] 注意: 'anchor_points' 功能正在開發中，目前僅 'bottom_center' 有效。
#
# 可選錨點策略:
#   - 'bottom_center': 辨識框底邊中心點。最適用於地面可見的高角度俯拍場景。 (當前預設)
#   - 'centroid':      辨識框的幾何中心。最適用於無法看到地面的半身人像場景。
#   - 'bottom_left', 'bottom_right', 'top_left', 'top_right': 四個角點。
#   - 'top_center', 'left_center', 'right_center': 三條邊的中心點。
#   - 'full_bbox':     整個辨識框區域。僅適用於 ROI 規則，判斷整個框是否與區域相交。
#   - 'bev_point':     鳥瞰視角(BEV)座標。需要預先校準 IPM。(尚未實現)
#
# 多錨點模式:
#   您可以提供一個列表，例如 ['bottom_left', 'bottom_right']。
#   在這種模式下，只要列表中的任何一個錨點滿足觸發條件，規則就會被觸發。
#
anchor_points: 'centroid'


# ===================================================================
# 1. 感興趣區域 (Region of Interest, ROI) - 停留偵測
# ===================================================================
# 用於偵測是否有物體在特定多邊形區域內停留時間過長。
roi:
  enabled: false

  # [可選] 覆寫全域錨點設定。
  # [!!] 注意: 此功能依賴於 'anchor_points' 系統的完成。
  # anchor_points: 'centroid'

  # ROI 區域的頂點座標列表。
  polygon_points:
    - [640, 200]
    - [1280, 200]
    - [1280, 720]
    - [640, 720]

  # 觸發「停留警報」所需的時間閾值 (秒)。
  dwell_time_threshold: 3.0


# ===================================================================
# 2. 虛擬警戒線 (Tripwire) - 穿越偵測
# ===================================================================
# 用於偵測是否有物體跨越了某條虛擬線段。
tripwires:
  enabled: true

  lines:
    - points: [[500, 736], [500, 0]]
      # [可選] 覆寫全域錨點設定。
      # [!!] 注意: 此功能依賴於 'anchor_points' 系統的完成。
      # anchor_points: 'centroid'
      alert_direction: "cross_to_right"


# ===================================================================
# 3. 遮蔽警報 (Occlusion Alert) - 基於 AI 偵測
# ===================================================================
# [!!] 注意: 'occlusion_alerts' 功能正在開發中，當前設定無效。
#
# 用於偵測是否有 "單個可識別物體" 的辨識框佔據了畫面過大的面積。
occlusion_alerts:
  enabled: false
  area_threshold_percentage: 0.5
  target_classes: []


# ===================================================================
# 4. 畫面異常警報 (Scene Anomaly Alert) - 基於影像分析
# ===================================================================
# [!!] 注意: 'scene_anomaly_alerts' 功能正在開發中，當前設定無效。
#
# 用於偵測視訊串流本身的底層異常，不依賴任何 AI 物件偵測。
scene_anomaly_alerts:
  enabled: false # 建議在開發完成前保持 false

  trigger_delay_seconds: 3.0

  luminance_check:
    enabled: true
    dark_threshold: 20
    bright_threshold: 230

  freeze_check:
    enabled: true
    difference_threshold: 0.1