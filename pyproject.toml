# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moshousapient"
version = "1.0.0"
description = "MoshouSapient: An AI-powered intelligent video analytics platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

[tool.setuptools.packages.find]
where = ["src"]